<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>

  .score-dot.correct { background: #4caf50; }
  .score-dot.wrong { background: #f44336; }
  .question-card { background: white; border: 3px solid #81c784; border-radius: 20px; padding: 28px 20px; margin-bottom: 14px; box-shadow: 0 4px 18px rgba(46,125,50,0.1); text-align: center; }
  .question-label { font-size: 0.85rem; font-weight: 800; color: #888; margin-bottom: 14px; background: #f1f8e9; padding: 4px 14px; border-radius: 20px; display: inline-block; }
  .question-sentence { font-size: 1.5rem; font-weight: 800; color: #1b5e20; line-height: 2; margin-bottom: 20px; }
  .highlight-word { color: #e53935; background: #ffebee; padding: 2px 8px; border-radius: 8px; border-bottom: 3px solid #e53935; }

  .btn-mudaf:hover:not(:disabled) { background: linear-gradient(135deg, #90caf9, #42a5f5); transform: translateY(-3px); box-shadow: 0 6px 18px rgba(21,101,192,0.35); }
  .btn-mudaf-ilayh { background: linear-gradient(135deg, #fff8e1, #ffe082); border-color: #f9a825; color: #e65100; }
  .btn-mudaf-ilayh:hover:not(:disabled) { background: linear-gradient(135deg, #ffe082, #ffc107); transform: translateY(-3px); box-shadow: 0 6px 18px rgba(249,168,37,0.35); }
  .btn-other { background: linear-gradient(135deg, #f3e5f5, #ce93d8); border-color: #6a1b9a; color: #4a148c; }
  .btn-other:hover:not(:disabled) { background: linear-gradient(135deg, #ce93d8, #ab47bc); transform: translateY(-3px); box-shadow: 0 6px 18px rgba(106,27,154,0.35); }
  .answer-btn:disabled { cursor: default; opacity: 0.85; transform: none !important; }
  .answer-btn.correct-ans { background: linear-gradient(135deg, #c8f7c5, #4caf50) !important; border-color: #2e7d32 !important; color: white !important; }
  .answer-btn.wrong-ans { background: linear-gradient(135deg, #ffc8c8, #f44336) !important; border-color: #c62828 !important; color: white !important; animation: shake 0.4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .btn-sub { display: block; font-size: 0.68rem; font-weight: 700; opacity: 0.85; margin-top: 3px; }
  .feedback { text-align: center; padding: 12px 16px; border-radius: 14px; font-size: 1rem; font-weight: 800; margin-bottom: 20px; display: none; line-height: 1.6; }
  .feedback.correct-fb { background: #e8f5e9; color: #2e7d32; border: 2px solid #4caf50; }
  .feedback.wrong-fb { background: #ffebee; color: #c62828; border: 2px solid #f44336; }
  .next-btn { width: 100%; padding: 18px; background: linear-gradient(90deg, #2e7d32, #43a047); color: white; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 800; font-family: "Tajawal", sans-serif; cursor: pointer; display: none; box-shadow: 0 3px 10px rgba(46,125,50,0.3); transition: transform 0.15s; }
  .next-btn:hover { transform: translateY(-2px); }
  .next-btn { margin-top: 8px; }
  .result-screen { background: white; border: 3px solid #81c784; border-radius: 20px; padding: 30px 20px; text-align: center; display: none; }
  .result-owl { font-size: 4rem; margin-bottom: 12px; }
  .result-title { font-size: 1.5rem; font-weight: 800; color: #1b5e20; margin-bottom: 8px; }
  .result-stars { font-size: 2.2rem; margin-bottom: 16px; }
  .result-score { font-size: 1rem; color: #2e7d32; margin-bottom: 22px; line-height: 1.8; }
  .retry-btn { background: linear-gradient(90deg, #2e7d32, #43a047); color: white; border: none; border-radius: 25px; padding: 12px 30px; font-size: 1rem; font-weight: 800; font-family: "Tajawal", sans-serif; cursor: pointer; }
  .loader-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease; }
  .loader-overlay.hidden { opacity: 0; pointer-events: none; }
  .loader-owl { font-size: 3.5rem; animation: bounce 0.8s infinite; margin-bottom: 16px; }
  .loader-title { font-size: 1.2rem; font-weight: 800; color: #1b5e20; margin-bottom: 16px; }
  .loader-bar { width: 200px; height: 8px; background: #a5d6a7; border-radius: 10px; overflow: hidden; }
  .loader-fill { height: 100%; background: linear-gradient(90deg, #2e7d32, #66bb6a); border-radius: 10px; animation: load-anim 1.5s ease-in-out infinite; }
  .loader-sub { font-size: 0.85rem; color: #388e3c; font-weight: 700; margin-top: 10px; }

    .answer-btn { padding: 16px 8px !important; min-height: 56px; }
    .answer-btns { gap: 8px; }
    .next-btn { padding: 20px !important; margin-top: 14px !important; font-size: 1.1rem; }
    .feedback { margin-bottom: 20px !important; }

</head>
<body>
<div class="loader-overlay" id="loaderOverlay">
  <div class="loader-owl">🦉</div>
  <div class="loader-title">المُضَافُ وَالمُضَافُ إِلَيْهِ</div>

    <div>

    </div>

  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  <div class="progress-text" id="progressText">السؤال 1 من 30</div>
  <div class="score-bar" id="scoreBar"></div>
  <div class="question-card" id="questionCard">
    <div class="question-label" id="questionLabel">السؤال 1</div>
    <div class="question-sentence" id="questionSentence"></div>
    <div class="question-instruction">ما نوع الكلمة الحمراء؟</div>
    <div class="answer-btns">
      <button class="answer-btn btn-mudaf" id="btnMudaf" onclick="checkAnswer('مضاف')">
        مُضَافٌ

      <button class="answer-btn btn-mudaf-ilayh" id="btnMudafIlayh" onclick="checkAnswer('مضاف إليه')">

      </button>
      <button class="answer-btn btn-other" id="btnOther" onclick="checkAnswer('ليس منهما')">
        لَيْسَ مِنْهُمَا

    </div>
  </div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي ←</button>
  <div class="result-screen" id="resultScreen">
    <div class="result-owl" id="resultOwl">🦉</div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <button class="retry-btn" onclick="restartQuiz()">🔄 حاول مرة أخرى</button>
  </div>
</div>
<script>

    "feedback": "المَدْرَسَةِ مضاف إليه مجرور بالكسرة – يأتي دائماً مجروراً"
  },
  {
    "sentence": "سَلَّمْتُ عَلَى أُسْتَاذِ <span class=\"highlight-word\">الفَصْلِ</span>",
    "answer": "مضاف إليه",
    "feedback": "الفَصْلِ مضاف إليه مجرور بالكسرة"
  },
  {
    "sentence": "اشْتَرَيْتُ حَقِيبَةَ <span class=\"highlight-word\">المَدْرَسَةِ</span>",

    "feedback": "صَدِيقِي مضاف إليه مجرور بالكسرة والياء ضمير متصل"
  },
  {
    "sentence": "قَرَأَ الوَلَدُ كِتَابَ <span class=\"highlight-word\">القِصَصِ</span>",

let current=0,score=0,answered=false;
function initScoreBar(){const bar=document.getElementById("scoreBar");bar.innerHTML="";for(let i=0;i<questions.length;i++){const dot=document.createElement("div");dot.className="score-dot";dot.id="dot-"+i;bar.appendChild(dot);}}
function loadQuestion(){answered=false;const q=questions[current];document.getElementById("progressBar").style.width=(current/questions.length*100)+"%";document.getElementById("progressText").textContent="السؤال "+(current+1)+" من "+questions.length;document.getElementById("questionLabel").textContent="السؤال "+(current+1);document.getElementById("questionSentence").innerHTML=q.sentence;document.getElementById("feedback").style.display="none";document.getElementById("nextBtn").style.display="none";document.getElementById("btnMudaf").disabled=false;document.getElementById("btnMudafIlayh").disabled=false;document.getElementById("btnOther").disabled=false;document.getElementById("btnMudaf").className="answer-btn btn-mudaf";document.getElementById("btnMudafIlayh").className="answer-btn btn-mudaf-ilayh";document.getElementById("btnOther").className="answer-btn btn-other";}
function checkAnswer(selected){if(answered)return;answered=true;const q=questions[current];const isCorrect=selected===q.answer;const feedback=document.getElementById("feedback");document.getElementById("btnMudaf").disabled=true;document.getElementById("btnMudafIlayh").disabled=true;document.getElementById("btnOther").disabled=true;
if(q.answer==="مضاف")document.getElementById("btnMudaf").classList.add("correct-ans");
else if(q.answer==="مضاف إليه")document.getElementById("btnMudafIlayh").classList.add("correct-ans");
else document.getElementById("btnOther").classList.add("correct-ans");
if(isCorrect){feedback.textContent="✅ "+["ممتاز! 🎉","أحسنت! 🌟","رائع! 👏","صحيح تماماً! 🏆"][Math.floor(Math.random()*4)]+" — "+q.feedback;feedback.className="feedback correct-fb";score++;document.getElementById("dot-"+current).classList.add("correct");document.getElementById("dot-"+current).textContent="✓";}
else{if(selected==="مضاف")document.getElementById("btnMudaf").classList.add("wrong-ans");else if(selected==="مضاف إليه")document.getElementById("btnMudafIlayh").classList.add("wrong-ans");else document.getElementById("btnOther").classList.add("wrong-ans");
