const CLASSES = ["btn-1","btn-2","btn-3","btn-4"];
function shuffle(arr){return[...arr].sort(()=>Math.random()-0.5);}
let current=0,score=0,answered=false;
function initScoreBar(){const bar=document.getElementById("scoreBar");bar.innerHTML="";for(let i=0;i<questions.length;i++){const dot=document.createElement("div");dot.className="score-dot";dot.id="dot-"+i;bar.appendChild(dot);}}
function loadQuestion(){answered=false;const q=questions[current];document.getElementById("progressBar").style.width=(current/questions.length*100)+"%";document.getElementById("progressText").textContent="السؤال "+(current+1)+" من "+questions.length;document.getElementById("questionLabel").textContent="السؤال "+(current+1);document.getElementById("questionSentence").innerHTML=q.sentence;document.getElementById("questionInstruction").textContent=q.hint;document.getElementById("feedback").style.display="none";document.getElementById("nextBtn").style.display="none";
const shuffled=shuffle(q.options);const btns=document.getElementById("answerBtns");btns.innerHTML="";
shuffled.forEach((opt,i)=>{const btn=document.createElement("button");btn.className="answer-btn "+CLASSES[i];btn.textContent=opt;btn.dataset.value=opt;btn.onclick=()=>checkAnswer(opt,btn,q);btns.appendChild(btn);});}
function checkAnswer(selected,btn,q){if(answered)return;answered=true;const isCorrect=selected===q.answer;const feedback=document.getElementById("feedback");
document.querySelectorAll(".answer-btn").forEach(b=>{b.disabled=true;if(b.dataset.value===q.answer)b.classList.add("correct-ans");});
if(isCorrect){feedback.textContent="✅ "+["ممتاز! 🎉","أحسنت! 🌟","رائع! 👏","صحيح! 🏆"][Math.floor(Math.random()*4)]+" — "+q.feedback;feedback.className="feedback correct-fb";score++;document.getElementById("dot-"+current).classList.add("correct");document.getElementById("dot-"+current).textContent="✓";}
else{btn.classList.add("wrong-ans");feedback.innerHTML="❌ الإجابة الصحيحة: <strong>"+q.answer+"</strong><br><small>"+q.feedback+"</small>";feedback.className="feedback wrong-fb";document.getElementById("dot-"+current).classList.add("wrong");document.getElementById("dot-"+current).textContent="✗";}
feedback.style.display="block";document.getElementById("nextBtn").style.display="block";document.getElementById("nextBtn").textContent=current<questions.length-1?"السؤال التالي ←":"🏆 اعرض النتيجة";}
function nextQuestion(){current++;if(current>=questions.length)showResult();else loadQuestion();}
function showResult(){document.getElementById("questionCard").style.display="none";document.getElementById("feedback").style.display="none";document.getElementById("nextBtn").style.display="none";document.getElementById("progressBar").style.width="100%";const pct=score/questions.length;let owl,title,stars;if(pct===1){owl="🦉✨";title="ممتاز! أتقنتَ التشبيه! 🏆";stars="⭐⭐⭐";}else if(pct>=0.8){owl="🦉🌟";title="أحسنت! عمل رائع!";stars="⭐⭐⭐";}else if(pct>=0.6){owl="🦉👍";title="جيد! راجع القاعدة!";stars="⭐⭐";}else if(pct>=0.4){owl="🦉💪";title="حاول مرة أخرى!";stars="⭐";}else{owl="🦉🔄";title="لا تستسلم!";stars="💪";}document.getElementById("resultOwl").textContent=owl;document.getElementById("resultTitle").textContent=title;document.getElementById("resultStars").textContent=stars;document.getElementById("resultScore").innerHTML="أجبت على <strong>"+score+"</strong> من أصل <strong>"+questions.length+"</strong><br>نسبة النجاح: <strong>"+Math.round(pct*100)+"%</strong>";document.getElementById("resultScreen").style.display="block";}
function restartQuiz(){current=0;score=0;document.getElementById("questionCard").style.display="block";document.getElementById("resultScreen").style.display="none";initScoreBar();loadQuestion();}
window.addEventListener("load",function(){setTimeout(function(){var o=document.getElementById("loaderOverlay");if(o){o.classList.add("hidden");setTimeout(function(){o.style.display="none";},500);}},500);});
initScoreBar();loadQuestion();
