<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Tajawal', sans-serif; direction: rtl; background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); min-height: 100vh; padding: 16px; display: flex; align-items: flex-start; justify-content: center; }
  .quiz-container { width: 100%; max-width: 680px; }
  .header { background: linear-gradient(135deg, #2e7d32, #43a047); border-radius: 18px; padding: 16px 20px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 16px rgba(46,125,50,0.3); }
  .header-title { font-size: 1.15rem; font-weight: 800; color: white; }
  .header-sub { font-size: 0.82rem; color: rgba(255,255,255,0.85); margin-top: 2px; }
  .owl { font-size: 2.2rem; }
  .progress-bar-wrap { background: rgba(46,125,50,0.15); border-radius: 20px; height: 10px; margin-bottom: 6px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #2e7d32, #66bb6a); border-radius: 20px; transition: width 0.4s ease; }
  .progress-text { font-size: 0.82rem; color: #2e7d32; text-align: center; margin-bottom: 10px; font-weight: 700; }
  .score-bar { display: flex; gap: 5px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .score-dot { width: 20px; height: 20px; border-radius: 50%; background: #c8e6c9; transition: all 0.3s; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; color: white; }
  .score-dot.correct { background: #4caf50; }
  .score-dot.wrong { background: #f44336; }
  .question-card { background: white; border: 3px solid #81c784; border-radius: 20px; padding: 28px 20px; margin-bottom: 14px; box-shadow: 0 4px 18px rgba(46,125,50,0.1); text-align: center; }
  .question-label { font-size: 0.85rem; font-weight: 800; color: #888; margin-bottom: 14px; background: #f1f8e9; padding: 4px 14px; border-radius: 20px; display: inline-block; }
  .question-sentence { font-size: 1.45rem; font-weight: 800; color: #1b5e20; line-height: 2; margin-bottom: 10px; }
  .blank { display: inline-block; background: #fff9c4; border: 2px dashed #f9a825; border-radius: 8px; padding: 2px 16px; color: #e65100; font-size: 1.5rem; font-weight: 900; min-width: 80px; }
  .question-instruction { font-size: 0.95rem; color: #555; margin-bottom: 18px; font-weight: 700; }
  .answer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .answer-btn { padding: 16px 10px; border-radius: 16px; border: 3px solid; font-size: 1.25rem; font-weight: 900; font-family: 'Tajawal', sans-serif; cursor: pointer; transition: all 0.2s; line-height: 1.4; text-align: center; }
  .btn-1 { background: linear-gradient(135deg, #e3f2fd, #90caf9); border-color: #1565c0; color: #0d47a1; }
  .btn-1:hover:not(:disabled) { background: linear-gradient(135deg, #90caf9, #42a5f5); transform: translateY(-3px); box-shadow: 0 6px 18px rgba(21,101,192,0.35); }
  .btn-2 { background: linear-gradient(135deg, #fff8e1, #ffe082); border-color: #f9a825; color: #e65100; }
  .btn-2:hover:not(:disabled) { background: linear-gradient(135deg, #ffe082, #ffc107); transform: translateY(-3px); box-shadow: 0 6px 18px rgba(249,168,37,0.35); }
  .btn-3 { background: linear-gradient(135deg, #f3e5f5, #ce93d8); border-color: #6a1b9a; color: #4a148c; }
  .btn-3:hover:not(:disabled) { background: linear-gradient(135deg, #ce93d8, #ab47bc); transform: translateY(-3px); box-shadow: 0 6px 18px rgba(106,27,154,0.35); }
  .btn-4 { background: linear-gradient(135deg, #fce4ec, #f48fb1); border-color: #880e4f; color: #880e4f; }
  .btn-4:hover:not(:disabled) { background: linear-gradient(135deg, #f48fb1, #f06292); transform: translateY(-3px); box-shadow: 0 6px 18px rgba(136,14,79,0.35); }
  .answer-btn:disabled { cursor: default; opacity: 0.85; transform: none !important; }
  .answer-btn.correct-ans { background: linear-gradient(135deg, #c8f7c5, #4caf50) !important; border-color: #2e7d32 !important; color: white !important; }
  .answer-btn.wrong-ans { background: linear-gradient(135deg, #ffc8c8, #f44336) !important; border-color: #c62828 !important; color: white !important; animation: shake 0.4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .btn-sub { display: block; font-size: 0.7rem; font-weight: 700; opacity: 0.8; margin-top: 3px; }
  .feedback { text-align: center; padding: 12px 16px; border-radius: 14px; font-size: 1rem; font-weight: 800; margin-bottom: 14px; display: none; line-height: 1.6; margin-top: 4px; }
  .feedback.correct-fb { background: #e8f5e9; color: #2e7d32; border: 2px solid #4caf50; }
  .feedback.wrong-fb { background: #ffebee; color: #c62828; border: 2px solid #f44336; }
  .next-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #2e7d32, #43a047); color: white; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 800; font-family: 'Tajawal', sans-serif; cursor: pointer; display: none; box-shadow: 0 3px 10px rgba(46,125,50,0.3); transition: transform 0.15s; }
  .next-btn:hover { transform: translateY(-2px); }
  .result-screen { background: white; border: 3px solid #81c784; border-radius: 20px; padding: 30px 20px; text-align: center; display: none; }
  .result-owl { font-size: 4rem; margin-bottom: 12px; }
  .result-title { font-size: 1.5rem; font-weight: 800; color: #1b5e20; margin-bottom: 8px; }
  .result-stars { font-size: 2.2rem; margin-bottom: 16px; }
  .result-score { font-size: 1rem; color: #2e7d32; margin-bottom: 22px; line-height: 1.8; }
  .retry-btn { background: linear-gradient(90deg, #2e7d32, #43a047); color: white; border: none; border-radius: 25px; padding: 12px 30px; font-size: 1rem; font-weight: 800; font-family: 'Tajawal', sans-serif; cursor: pointer; } .answer-btn { font-size: 1.05rem; padding: 12px 8px; } }

  .loader-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 9999; transition: opacity 0.5s ease;
  }
  .loader-overlay.hidden { opacity: 0; pointer-events: none; }
  .loader-owl { font-size: 3.5rem; animation: bounce 0.8s infinite; margin-bottom: 16px; }
  .loader-title { font-size: 1.2rem; font-weight: 800; color: #1b5e20; margin-bottom: 16px; }
  .loader-bar { width: 200px; height: 8px; background: #a5d6a7; border-radius: 10px; overflow: hidden; }
  .loader-fill { height: 100%; background: linear-gradient(90deg, #2e7d32, #66bb6a); border-radius: 10px; animation: load-anim 1.5s ease-in-out infinite; }
  .loader-sub { font-size: 0.85rem; color: #388e3c; font-weight: 700; margin-top: 10px; }
  @keyframes load-anim { 0%{width:0%} 60%{width:80%} 100%{width:100%} }
    .answer-btn { padding: 16px 8px !important; min-height: 56px; }
    .answer-btns { gap: 8px; }
    .next-btn { padding: 20px !important; margin-top: 14px !important; font-size: 1.1rem; }
    .feedback { margin-bottom: 20px !important; }
  }

  @media (max-width: 500px) {
    body { padding: 10px 8px; }
    .quiz-container { max-width: 100%; }
    .header { padding: 12px 14px; margin-bottom: 10px; }
    .header-title { font-size: 1rem; }
    .header-sub { font-size: 0.75rem; }
    .question-card { padding: 18px 12px; margin-bottom: 10px; }
    .question-sentence { font-size: 1.1rem; line-height: 1.9; margin-bottom: 14px; }
    .question-instruction { font-size: 0.88rem; margin-bottom: 12px; }
    .answer-btns { gap: 8px; }
    .answer-btn { font-size: 1rem !important; padding: 18px 8px !important; min-height: 60px !important; border-radius: 12px; }
    .btn-sub { font-size: 0.62rem !important; }
    .feedback { font-size: 0.9rem; padding: 12px; margin-bottom: 16px; margin-top: 4px; }
    .next-btn { padding: 20px !important; font-size: 1.05rem !important; margin-top: 10px; border-radius: 12px; min-height: 60px; }
    .score-bar { gap: 4px; margin-bottom: 10px; }
    .score-dot { width: 18px; height: 18px; font-size: 0.6rem; }
    .progress-text { font-size: 0.78rem; margin-bottom: 8px; }
    .result-screen { padding: 24px 14px; }
    .result-title { font-size: 1.2rem; }
    .owl { font-size: 1.8rem; }
  }

</style>
</head>
<body>
<div class="loader-overlay" id="loaderOverlay">
  <div class="loader-owl">🦉</div>
  <div class="loader-title">الأَسْمَاءُ المَوْصُولَةُ</div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div class="loader-sub">جارٍ التحميل...</div>
</div>
<div class="quiz-container">
  <div class="header">
    <div>
      <div class="header-title">🔗 الأَسْمَاءُ المَوْصُولَةُ</div>
      <div class="header-sub">30 سؤالاً – اختر الاسم الموصول المناسب</div>
    </div>
    <div class="owl">🦉</div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  <div class="progress-text" id="progressText">السؤال 1 من 30</div>
  <div class="score-bar" id="scoreBar"></div>
  <div class="question-card" id="questionCard">
    <div class="question-label" id="questionLabel">السؤال 1</div>
    <div class="question-sentence" id="questionSentence"></div>
    <div class="question-instruction">اختر الاسم الموصول المناسب للفراغ</div>
    <div class="answer-btns" id="answerBtns"></div>
  </div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي ←</button>
  <div class="result-screen" id="resultScreen">
    <div class="result-owl" id="resultOwl">🦉</div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <button class="retry-btn" onclick="restartQuiz()">🔄 حاول مرة أخرى</button>
  </div>
</div>
<script>
// الأسماء الموصولة الأربعة
const OPTIONS = [
  { text: 'الَّذِي', sub: 'مفرد مذكر', cls: 'btn-1' },
  { text: 'الَّتِي', sub: 'مفرد مؤنث', cls: 'btn-2' },
  { text: 'الَّذِينَ', sub: 'جمع مذكر', cls: 'btn-3' },
  { text: 'اللَّوَاتِي', sub: 'جمع مؤنث', cls: 'btn-4' },
];

const questions = [
  { sentence: 'الوَلَدُ <span class="blank">____</span> يَدْرُسُ كَثِيرًا يَنْجَحُ', answer: 'الَّذِي', feedback: 'الوَلَدُ مفرد مذكر → الَّذِي' },
  { sentence: 'البِنْتُ <span class="blank">____</span> تَجْتَهِدُ تَنْجَحُ', answer: 'الَّتِي', feedback: 'البِنْتُ مفرد مؤنث → الَّتِي' },
  { sentence: 'الطُّلَّابُ <span class="blank">____</span> يَجْتَهِدُونَ يَفُوزُونَ', answer: 'الَّذِينَ', feedback: 'الطُّلَّابُ جمع مذكر → الَّذِينَ' },
  { sentence: 'الطَّالِبَاتُ <span class="blank">____</span> يَدْرُسْنَ يَتَفَوَّقْنَ', answer: 'اللَّوَاتِي', feedback: 'الطَّالِبَاتُ جمع مؤنث → اللَّوَاتِي' },
  { sentence: 'المُعَلِّمُ <span class="blank">____</span> شَرَحَ الدَّرْسَ مُتَمَيِّزٌ', answer: 'الَّذِي', feedback: 'المُعَلِّمُ مفرد مذكر → الَّذِي' },
  { sentence: 'المُعَلِّمَةُ <span class="blank">____</span> شَرَحَتِ الدَّرْسَ مُتَمَيِّزَةٌ', answer: 'الَّتِي', feedback: 'المُعَلِّمَةُ مفرد مؤنث → الَّتِي' },
  { sentence: 'الكِتَابُ <span class="blank">____</span> قَرَأْتُهُ مُفِيدٌ', answer: 'الَّذِي', feedback: 'الكِتَابُ مفرد مذكر → الَّذِي' },
  { sentence: 'الرِّسَالَةُ <span class="blank">____</span> كَتَبْتُهَا طَوِيلَةٌ', answer: 'الَّتِي', feedback: 'الرِّسَالَةُ مفرد مؤنث → الَّتِي' },
  { sentence: 'الأَوْلَادُ <span class="blank">____</span> يَلْعَبُونَ فِي الحَدِيقَةِ مَرِحُونَ', answer: 'الَّذِينَ', feedback: 'الأَوْلَادُ جمع مذكر → الَّذِينَ' },
  { sentence: 'البَنَاتُ <span class="blank">____</span> يَلْعَبْنَ فِي السَّاحَةِ مَرِحَاتٌ', answer: 'اللَّوَاتِي', feedback: 'البَنَاتُ جمع مؤنث → اللَّوَاتِي' },
  { sentence: 'السَّيَّارَةُ <span class="blank">____</span> اشْتَرَاهَا أَبِي جَدِيدَةٌ', answer: 'الَّتِي', feedback: 'السَّيَّارَةُ مفرد مؤنث → الَّتِي' },
  { sentence: 'الطَّبِيبُ <span class="blank">____</span> عَالَجَنِي مَاهِرٌ', answer: 'الَّذِي', feedback: 'الطَّبِيبُ مفرد مذكر → الَّذِي' },
  { sentence: 'الأُمَّهَاتُ <span class="blank">____</span> يُرَبِّينَ أَبْنَاءَهُنَّ مُخْلِصَاتٌ', answer: 'اللَّوَاتِي', feedback: 'الأُمَّهَاتُ جمع مؤنث → اللَّوَاتِي' },
  { sentence: 'المُهَنْدِسُونَ <span class="blank">____</span> بَنَوُا الجِسْرَ مَاهِرُونَ', answer: 'الَّذِينَ', feedback: 'المُهَنْدِسُونَ جمع مذكر → الَّذِينَ' },
  { sentence: 'الشَّجَرَةُ <span class="blank">____</span> زَرَعْتُهَا كَبِيرَةٌ', answer: 'الَّتِي', feedback: 'الشَّجَرَةُ مفرد مؤنث → الَّتِي' },
  { sentence: 'الفِلْمُ <span class="blank">____</span> شَاهَدْتُهُ مُمْتِعٌ', answer: 'الَّذِي', feedback: 'الفِلْمُ مفرد مذكر → الَّذِي' },
  { sentence: 'الفَتَيَاتُ <span class="blank">____</span> فُزْنَ بِالجَائِزَةِ مُوَهَّبَاتٌ', answer: 'اللَّوَاتِي', feedback: 'الفَتَيَاتُ جمع مؤنث → اللَّوَاتِي' },
  { sentence: 'الرِّجَالُ <span class="blank">____</span> عَمِلُوا بِجِدٍّ نَجَحُوا', answer: 'الَّذِينَ', feedback: 'الرِّجَالُ جمع مذكر → الَّذِينَ' },
  { sentence: 'القَلَمُ <span class="blank">____</span> فَقَدْتُهُ كَانَ جَدِيدًا', answer: 'الَّذِي', feedback: 'القَلَمُ مفرد مذكر → الَّذِي' },
  { sentence: 'الحَقِيبَةُ <span class="blank">____</span> اشْتَرَيْتُهَا غَالِيَةٌ', answer: 'الَّتِي', feedback: 'الحَقِيبَةُ مفرد مؤنث → الَّتِي' },
  { sentence: 'اللَّاعِبُونَ <span class="blank">____</span> تَدَرَّبُوا كَثِيرًا فَازُوا', answer: 'الَّذِينَ', feedback: 'اللَّاعِبُونَ جمع مذكر → الَّذِينَ' },
  { sentence: 'المَدْرَسَةُ <span class="blank">____</span> أَدْرُسُ فِيهَا قَرِيبَةٌ', answer: 'الَّتِي', feedback: 'المَدْرَسَةُ مفرد مؤنث → الَّتِي' },
  { sentence: 'الجَارُ <span class="blank">____</span> يُسَاعِدُنَا طَيِّبٌ', answer: 'الَّذِي', feedback: 'الجَارُ مفرد مذكر → الَّذِي' },
  { sentence: 'الجَارَاتُ <span class="blank">____</span> يُسَاعِدْنَنَا طَيِّبَاتٌ', answer: 'اللَّوَاتِي', feedback: 'الجَارَاتُ جمع مؤنث → اللَّوَاتِي' },
  { sentence: 'المُسَافِرُونَ <span class="blank">____</span> وَصَلُوا مُتْعَبُونَ', answer: 'الَّذِينَ', feedback: 'المُسَافِرُونَ جمع مذكر → الَّذِينَ' },
  { sentence: 'البَيْتُ <span class="blank">____</span> نَسْكُنُ فِيهِ وَاسِعٌ', answer: 'الَّذِي', feedback: 'البَيْتُ مفرد مذكر → الَّذِي' },
  { sentence: 'الحَدِيقَةُ <span class="blank">____</span> نَلْعَبُ فِيهَا جَمِيلَةٌ', answer: 'الَّتِي', feedback: 'الحَدِيقَةُ مفرد مؤنث → الَّتِي' },
  { sentence: 'الأَطْفَالُ <span class="blank">____</span> يَلْعَبُونَ سُعَدَاءُ', answer: 'الَّذِينَ', feedback: 'الأَطْفَالُ جمع مذكر → الَّذِينَ' },
  { sentence: 'الطِّفْلَةُ <span class="blank">____</span> تَبْكِي مَرِيضَةٌ', answer: 'الَّتِي', feedback: 'الطِّفْلَةُ مفرد مؤنث → الَّتِي' },
  { sentence: 'الصَّدِيقَاتُ <span class="blank">____</span> زُرْنَنِي أَمْسِ مُخْلِصَاتٌ', answer: 'اللَّوَاتِي', feedback: 'الصَّدِيقَاتُ جمع مؤنث → اللَّوَاتِي' },
];

let current = 0, score = 0, answered = false;

function initScoreBar() {
  const bar = document.getElementById('scoreBar'); bar.innerHTML = '';
  for (let i = 0; i < questions.length; i++) {
    const dot = document.createElement('div'); dot.className = 'score-dot'; dot.id = `dot-${i}`; bar.appendChild(dot);
  }
}

function loadQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('progressBar').style.width = (current / questions.length * 100) + '%';
  document.getElementById('progressText').textContent = `السؤال ${current + 1} من ${questions.length}`;
  document.getElementById('questionLabel').textContent = `السؤال ${current + 1}`;
  document.getElementById('questionSentence').innerHTML = q.sentence;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  const btns = document.getElementById('answerBtns');
  btns.innerHTML = '';
  OPTIONS.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = `answer-btn ${opt.cls}`;
    btn.innerHTML = `${opt.text}<span class="btn-sub">${opt.sub}</span>`;
    btn.onclick = () => checkAnswer(opt.text, btn, q);
    btns.appendChild(btn);
  });
}

function checkAnswer(selected, btn, q) {
  if (answered) return;
  answered = true;
  const isCorrect = selected === q.answer;
  const feedback = document.getElementById('feedback');

  document.querySelectorAll('.answer-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim().startsWith(q.answer.trim())) b.classList.add('correct-ans');
  });

  if (isCorrect) {
    feedback.textContent = '✅ ' + ['ممتاز! 🎉','أحسنت! 🌟','رائع! 👏','صحيح! 🏆'][Math.floor(Math.random()*4)] + ' — ' + q.feedback;
    feedback.className = 'feedback correct-fb';
    score++;
    document.getElementById(`dot-${current}`).classList.add('correct');
    document.getElementById(`dot-${current}`).textContent = '✓';
  } else {
    btn.classList.add('wrong-ans');
    feedback.innerHTML = `❌ الإجابة الصحيحة: <strong>${q.answer}</strong><br><small>${q.feedback}</small>`;
    feedback.className = 'feedback wrong-fb';
    document.getElementById(`dot-${current}`).classList.add('wrong');
    document.getElementById(`dot-${current}`).textContent = '✗';
  }
  feedback.style.display = 'block';
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('nextBtn').textContent = current < questions.length - 1 ? 'السؤال التالي ←' : '🏆 اعرض النتيجة';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) showResult();
  else loadQuestion();
}

function showResult() {
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
  const pct = score / questions.length;
  let owl, title, stars;
  if (pct === 1) { owl='🦉✨'; title='ممتاز! أتقنتَ الأسماء الموصولة! 🏆'; stars='⭐⭐⭐'; }
  else if (pct >= 0.8) { owl='🦉🌟'; title='أحسنت! عمل رائع!'; stars='⭐⭐⭐'; }
  else if (pct >= 0.6) { owl='🦉👍'; title='جيد! راجع القاعدة وحاول مجدداً!'; stars='⭐⭐'; }
  else if (pct >= 0.4) { owl='🦉💪'; title='حاول مرة أخرى!'; stars='⭐'; }
  else { owl='🦉🔄'; title='لا تستسلم! التكرار مفتاح النجاح!'; stars='💪'; }
  document.getElementById('resultOwl').textContent = owl;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultStars').textContent = stars;
  document.getElementById('resultScore').innerHTML = `أجبت على <strong>${score}</strong> من أصل <strong>${questions.length}</strong> سؤالاً بشكل صحيح<br>نسبة النجاح: <strong>${Math.round(pct*100)}%</strong>`;
  document.getElementById('resultScreen').style.display = 'block';
}

function restartQuiz() {
  current=0; score=0;
  document.getElementById('questionCard').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
  initScoreBar(); loadQuestion();
}

initScoreBar(); loadQuestion();

window.addEventListener('load', function() {
  setTimeout(function() {
    var overlay = document.getElementById('loaderOverlay');
    if (overlay) {
      overlay.classList.add('hidden');
      setTimeout(function(){ overlay.style.display='none'; }, 500);
    }
  }, 500);
});

</script>
</body>
</html>
