function loadQuestion(){answered=false;const q=questions[current];document.getElementById("progressBar").style.width=(current/questions.length*100)+"%";document.getElementById("progressText").textContent="السؤال "+(current+1)+" من "+questions.length;document.getElementById("questionLabel").textContent="السؤال "+(current+1);document.getElementById("questionSentence").innerHTML=q.sentence;document.getElementById("feedback").style.display="none";document.getElementById("nextBtn").style.display="none";document.getElementById("btnMaqsoura").disabled=false;document.getElementById("btnMamdouda").disabled=false;document.getElementById("btnMaqsoura").className="answer-btn btn-maqsoura";document.getElementById("btnMamdouda").className="answer-btn btn-mamdouda";}
function checkAnswer(selected){if(answered)return;answered=true;const q=questions[current];const isCorrect=selected===q.answer;const feedback=document.getElementById("feedback");document.getElementById("btnMaqsoura").disabled=true;document.getElementById("btnMamdouda").disabled=true;
if(q.answer==="مقصورة")document.getElementById("btnMaqsoura").classList.add("correct-ans");
else document.getElementById("btnMamdouda").classList.add("correct-ans");
if(isCorrect){feedback.textContent="✅ "+["ممتاز! 🎉","أحسنت! 🌟","رائع! 👏","صحيح تماماً! 🏆"][Math.floor(Math.random()*4)]+" — "+q.feedback;feedback.className="feedback correct-fb";score++;document.getElementById("dot-"+current).classList.add("correct");document.getElementById("dot-"+current).textContent="✓";}
else{if(selected==="مقصورة")document.getElementById("btnMaqsoura").classList.add("wrong-ans");else document.getElementById("btnMamdouda").classList.add("wrong-ans");
const labels={"مقصورة":"أَلِفٌ مَقْصُورَةٌ","ممدودة":"أَلِفٌ مَمْدُودَةٌ"};
feedback.innerHTML="❌ الإجابة الصحيحة: <strong>"+labels[q.answer]+"</strong><br><small>"+q.feedback+"</small>";feedback.className="feedback wrong-fb";document.getElementById("dot-"+current).classList.add("wrong");document.getElementById("dot-"+current).textContent="✗";}
feedback.style.display="block";document.getElementById("nextBtn").style.display="block";document.getElementById("nextBtn").textContent=current<questions.length-1?"السؤال التالي ←":"🏆 اعرض النتيجة";}
function nextQuestion(){current++;if(current>=questions.length)showResult();else loadQuestion();}
function showResult(){document.getElementById("questionCard").style.display="none";document.getElementById("feedback").style.display="none";document.getElementById("nextBtn").style.display="none";document.getElementById("progressBar").style.width="100%";const pct=score/questions.length;let owl,title,stars;if(pct===1){owl="🦉✨";title="ممتاز! أتقنتَ الألف المقصورة والممدودة! 🏆";stars="⭐⭐⭐";}else if(pct>=0.8){owl="🦉🌟";title="أحسنت! عمل رائع!";stars="⭐⭐⭐";}else if(pct>=0.6){owl="🦉👍";title="جيد! راجع القاعدة!";stars="⭐⭐";}else if(pct>=0.4){owl="🦉💪";title="حاول مرة أخرى!";stars="⭐";}else{owl="🦉🔄";title="لا تستسلم!";stars="💪";}document.getElementById("resultOwl").textContent=owl;document.getElementById("resultTitle").textContent=title;document.getElementById("resultStars").textContent=stars;document.getElementById("resultScore").innerHTML="أجبت على <strong>"+score+"</strong> من أصل <strong>"+questions.length+"</strong><br>نسبة النجاح: <strong>"+Math.round(pct*100)+"%</strong>";document.getElementById("resultScreen").style.display="block";}
function restartQuiz(){current=0;score=0;document.getElementById("questionCard").style.display="block";document.getElementById("resultScreen").style.display="none";initScoreBar();loadQuestion();}
window.addEventListener("load",function(){setTimeout(function(){var o=document.getElementById("loaderOverlay");if(o){o.classList.add("hidden");setTimeout(function(){o.style.display="none";},500);}},500);});
initScoreBar();loadQuestion();

// Fix mobile touch delay
document.addEventListener('touchstart', function(){}, {passive: true});


// Fix next button for mobile iFrame
(function() {
  var btn = document.getElementById('nextBtn');
  if (!btn) return;
  var fired = false;
  function handleNext(e) {
    e.preventDefault();
    e.stopPropagation();
    if (fired) return;
    fired = true;
    setTimeout(function() { fired = false; }, 500);
    nextQuestion();
  }
  btn.addEventListener('touchend', handleNext, {passive: false});
  btn.addEventListener('click', handleNext);
})();

</script>
</body>
</html>
