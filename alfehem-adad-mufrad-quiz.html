<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Tajawal', sans-serif; direction: rtl; background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); min-height: 100vh; padding: 16px; display: flex; align-items: flex-start; justify-content: center; }

  .header { background: linear-gradient(135deg, #2e7d32, #43a047); border-radius: 18px; padding: 16px 20px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 16px rgba(46,125,50,0.3); }
  .header-title { font-size: 1.15rem; font-weight: 800; color: white; }
  .header-sub { font-size: 0.82rem; color: rgba(255,255,255,0.85); margin-top: 2px; }
  .owl { font-size: 2.2rem; }
  .progress-bar-wrap { background: rgba(46,125,50,0.15); border-radius: 20px; height: 10px; margin-bottom: 6px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #2e7d32, #66bb6a); border-radius: 20px; transition: width 0.4s ease; }
  .progress-text { font-size: 0.82rem; color: #2e7d32; text-align: center; margin-bottom: 10px; font-weight: 700; }
  .score-bar { display: flex; gap: 5px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .score-dot { width: 20px; height: 20px; border-radius: 50%; background: #c8e6c9; transition: all 0.3s; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; color: white; }
  .score-dot.correct { background: #4caf50; }
  .score-dot.wrong { background: #f44336; }
  .question-card { background: white; border: 3px solid #81c784; border-radius: 20px; padding: 28px 20px; margin-bottom: 14px; box-shadow: 0 4px 18px rgba(46,125,50,0.1); text-align: center; }
  .question-label { font-size: 0.85rem; font-weight: 800; color: #888; margin-bottom: 14px; background: #f1f8e9; padding: 4px 14px; border-radius: 20px; display: inline-block; }
  .question-sentence { font-size: 1.4rem; font-weight: 800; color: #1b5e20; line-height: 2; margin-bottom: 10px; }
  .blank { display: inline-block; background: #fff9c4; border: 2px dashed #f9a825; border-radius: 8px; padding: 2px 16px; color: #e65100; font-size: 1.5rem; font-weight: 900; min-width: 80px; }

  .btn-2 { background: linear-gradient(135deg, #fff8e1, #ffe082); border-color: #f9a825; color: #e65100; }
  .btn-2:hover:not(:disabled) { background: linear-gradient(135deg, #ffe082, #ffc107); transform: translateY(-3px); box-shadow: 0 6px 18px rgba(249,168,37,0.35); }
  .btn-3 { background: linear-gradient(135deg, #f3e5f5, #ce93d8); border-color: #6a1b9a; color: #4a148c; }
  .btn-3:hover:not(:disabled) { background: linear-gradient(135deg, #ce93d8, #ab47bc); transform: translateY(-3px); box-shadow: 0 6px 18px rgba(106,27,154,0.35); }

  .answer-btn.wrong-ans { background: linear-gradient(135deg, #ffc8c8, #f44336) !important; border-color: #c62828 !important; color: white !important; animation: shake 0.4s; }

  .feedback { text-align: center; padding: 12px 16px; border-radius: 14px; font-size: 1rem; font-weight: 800; margin-bottom: 14px; display: none; line-height: 1.6; }
  .feedback.correct-fb { background: #e8f5e9; color: #2e7d32; border: 2px solid #4caf50; }
  .feedback.wrong-fb { background: #ffebee; color: #c62828; border: 2px solid #f44336; }
  .next-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #2e7d32, #43a047); color: white; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 800; font-family: 'Tajawal', sans-serif; cursor: pointer; display: none; box-shadow: 0 3px 10px rgba(46,125,50,0.3); transition: transform 0.15s; }

  .result-screen { background: white; border: 3px solid #81c784; border-radius: 20px; padding: 30px 20px; text-align: center; display: none; }
  .result-owl { font-size: 4rem; margin-bottom: 12px; }
  .result-title { font-size: 1.5rem; font-weight: 800; color: #1b5e20; margin-bottom: 8px; }
  .result-stars { font-size: 2.2rem; margin-bottom: 16px; }

  .retry-btn { background: linear-gradient(90deg, #2e7d32, #43a047); color: white; border: none; border-radius: 25px; padding: 12px 30px; font-size: 1rem; font-weight: 800; font-family: 'Tajawal', sans-serif; cursor: pointer; }

  .loader-overlay {

    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);

    sentence: 'سَافَرَ <span class="blank">____</span> حَاجٍّ إِلَى مَكَّةَ',
    answer: 'أَلْفُ',
    options: ['مِئَةُ', 'أَلْفُ', 'عَشَرَةُ', 'آلَافُ'],
    feedback: 'الأَلْف + مفرد مجرور: أَلْفُ حَاجٍّ. الألف لا تتغير مع المعدود'
  },
  {
    sentence: 'قَرَأَ التِّلْمِيذُ <span class="blank">____</span> صَفْحَةٍ',
    answer: 'مِئَةَ',
    options: ['مِئَةَ', 'مِئَاتِ', 'عَشَرَةَ', 'أَلْفَ'],
    feedback: 'المِئَة منصوبة هنا + مفرد مجرور: مِئَةَ صَفْحَةٍ'
  },
  // مراجعة شاملة
  {
    sentence: 'فِي الحَدِيقَةِ <span class="blank">____</span> وَرْدَةٍ',
    answer: 'سِتُّ',
    options: ['سِتَّةُ', 'سِتُّ', 'سِتُّونَ', 'سِتَّةَ عَشَرَ'],
    feedback: 'وَرْدَة مؤنث → سِتُّ (مرفوع). الأعداد 3-10 تخالف المعدود'
  },
  {
    sentence: 'اشْتَرَى أَبِي <span class="blank">____</span> كُرَاسَاتٍ',
    answer: 'سَبْعَ',
    options: ['سَبْعَةَ', 'سَبْعَ', 'سَبْعُونَ', 'سَبْعَ عَشَرَ'],
    feedback: 'كُرَاسَات جمع مؤنث → سَبْعَ. الأعداد 3-10 تخالف المعدود'
  },
  {
    sentence: 'فِي المَكْتَبِ <span class="blank">____</span> مُوَظَّفٍ',
    answer: 'عَشَرَةُ',
    options: ['عَشْرُ', 'عَشَرَةُ', 'عِشْرُونَ', 'مِئَةُ'],
    feedback: 'مُوَظَّف مذكر → عَشَرَةُ. الأعداد 3-10 تخالف المعدود'
  },
];

let current = 0, score = 0, answered = false;
const CLASSES = ['btn-1','btn-2','btn-3','btn-4'];

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function initScoreBar() {
  const bar = document.getElementById('scoreBar'); bar.innerHTML = '';
  for (let i = 0; i < questions.length; i++) {
    const dot = document.createElement('div'); dot.className = 'score-dot'; dot.id = `dot-${i}`; bar.appendChild(dot);
  }
}

function loadQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('progressBar').style.width = (current / questions.length * 100) + '%';
  document.getElementById('progressText').textContent = `السؤال ${current + 1} من ${questions.length}`;
  document.getElementById('questionLabel').textContent = `السؤال ${current + 1}`;
  document.getElementById('questionSentence').innerHTML = q.sentence;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  const shuffled = shuffle(q.options);
  const btns = document.getElementById('answerBtns');
  btns.innerHTML = '';
  shuffled.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = `answer-btn ${CLASSES[i]}`;
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(opt, btn, q);
    btns.appendChild(btn);
  });
}

function checkAnswer(selected, btn, q) {
  if (answered) return;
  answered = true;
  const isCorrect = selected === q.answer;
  const feedback = document.getElementById('feedback');
  document.querySelectorAll('.answer-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct-ans');
  });
  if (isCorrect) {
    feedback.textContent = '✅ ' + ['ممتاز! 🎉','أحسنت! 🌟','رائع! 👏','صحيح! 🏆'][Math.floor(Math.random()*4)] + ' — ' + q.feedback;
    feedback.className = 'feedback correct-fb';
    score++;
    document.getElementById(`dot-${current}`).classList.add('correct');
    document.getElementById(`dot-${current}`).textContent = '✓';
  } else {
    btn.classList.add('wrong-ans');
    feedback.innerHTML = `❌ الإجابة الصحيحة: <strong>${q.answer}</strong><br><small>${q.feedback}</small>`;
    feedback.className = 'feedback wrong-fb';
    document.getElementById(`dot-${current}`).classList.add('wrong');
    document.getElementById(`dot-${current}`).textContent = '✗';
  }
  feedback.style.display = 'block';
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('nextBtn').textContent = current < questions.length - 1 ? 'السؤال التالي ←' : '🏆 اعرض النتيجة';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) showResult();
  else loadQuestion();
}

function showResult() {
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
  const pct = score / questions.length;
  let owl, title, stars;
  if (pct === 1) { owl='🦉✨'; title='ممتاز! أتقنتَ العدد المفرد! 🏆'; stars='⭐⭐⭐'; }
  else if (pct >= 0.8) { owl='🦉🌟'; title='أحسنت! عمل رائع!'; stars='⭐⭐⭐'; }
  else if (pct >= 0.6) { owl='🦉👍'; title='جيد! راجع القاعدة وحاول مجدداً!'; stars='⭐⭐'; }
  else if (pct >= 0.4) { owl='🦉💪'; title='حاول مرة أخرى!'; stars='⭐'; }
  else { owl='🦉🔄'; title='لا تستسلم! التكرار مفتاح النجاح!'; stars='💪'; }
  document.getElementById('resultOwl').textContent = owl;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultStars').textContent = stars;
  document.getElementById('resultScore').innerHTML = `أجبت على <strong>${score}</strong> من أصل <strong>${questions.length}</strong> سؤالاً بشكل صحيح<br>نسبة النجاح: <strong>${Math.round(pct*100)}%</strong>`;
  document.getElementById('resultScreen').style.display = 'block';
}

function restartQuiz() {
  current=0; score=0;
  document.getElementById('questionCard').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
  initScoreBar(); loadQuestion();
}

initScoreBar(); loadQuestion();

window.addEventListener('load', function() {
  setTimeout(function() {
    var overlay = document.getElementById('loaderOverlay');
    if (overlay) {
      overlay.classList.add('hidden');
      setTimeout(function(){ overlay.style.display='none'; }, 500);
    }
  }, 500);
});

</script>
