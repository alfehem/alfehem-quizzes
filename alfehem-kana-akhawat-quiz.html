else{if(selected==="اسم كان")document.getElementById("btnIsm").classList.add("wrong-ans");else if(selected==="خبر كان")document.getElementById("btnKhabar").classList.add("wrong-ans");else document.getElementById("btnOther").classList.add("wrong-ans");

function showResult(){document.getElementById("questionCard").style.display="none";document.getElementById("feedback").style.display="none";document.getElementById("nextBtn").style.display="none";document.getElementById("progressBar").style.width="100%";const pct=score/questions.length;let owl,title,stars;if(pct===1){owl="🦉✨";title="ممتاز! أتقنتَ كان وأخواتها! 🏆";stars="⭐⭐⭐";}else if(pct>=0.8){owl="🦉🌟";title="أحسنت! عمل رائع!";stars="⭐⭐⭐";}else if(pct>=0.6){owl="🦉👍";title="جيد! راجع القاعدة!";stars="⭐⭐";}else if(pct>=0.4){owl="🦉💪";title="حاول مرة أخرى!";stars="⭐";}else{owl="🦉🔄";title="لا تستسلم!";stars="💪";}document.getElementById("resultOwl").textContent=owl;document.getElementById("resultTitle").textContent=title;document.getElementById("resultStars").textContent=stars;document.getElementById("resultScore").innerHTML="أجبت على <strong>"+score+"</strong> من أصل <strong>"+questions.length+"</strong><br>نسبة النجاح: <strong>"+Math.round(pct*100)+"%</strong>";document.getElementById("resultScreen").style.display="block";}
